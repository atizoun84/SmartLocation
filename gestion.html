<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SmartLocation – Saisie des paiements</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <style>
    body {
      background-color: #f0f2f5;
      font-family: 'Segoe UI', sans-serif;
      padding-top: 70px;
    }
    h2 {
      color: #003366;
      font-weight: 600;
    }
    .form-label {
      font-weight: 500;
      color: #003366;
    }
    .btn-primary {
      background-color: #003366;
      border: none;
    }
    .btn-primary:hover {
      background-color: #00509e;
    }
    .navbar {
      background-color: #003366;
    }
    .navbar-brand, .nav-link {
      color: white !important;
    }
    .nav-link:hover {
      text-decoration: underline;
    }
    .navbar-date {
      color: #ffcc00;
      font-weight: bold;
      font-size: 0.9rem;
    }
    footer {
      margin-top: 40px;
      font-size: 0.9em;
      text-align: center;
      color: #666;
    }
    #historiqueSection {
      display: none; 
    }
    .table-responsive {
        overflow-x: auto;
    }
    .input-group-append button {
        border-top-left-radius: 0;
        border-bottom-left-radius: 0;
    }
    .info-recuperee {
        color: #0099ff !important;
        font-weight: bold !important;
        font-family: 'Tahoma', sans-serif !important;
    }
    #montantCumulePaye {
        color: #0d6efd !important;
        font-weight: bold !important;
        background-color: #e7f3ff;
    }
    #montantRetards {
        color: #dc3545 !important;
        font-weight: bold !important;
        background-color: #f8d7da;
    }
    /* Nouveaux Styles pour les codes couleurs des mois */
    .option-paye {
      color: #0099ff !important;
      font-weight: bold;
    }
    .option-retard {
      color: #dc3545 !important;
      font-weight: bold;
    }
    .facture-box-whatsapp {
        white-space: pre-wrap;
        font-family: monospace;
        background-color: #f8f9fa;
        border: 1px solid #dee2e6;
        padding: 15px;
        color: #212529;
        max-height: 70vh;
        overflow-y: auto;
    }
    /* Style Spécifique Rapport Impression */
    @media print {
        body { padding-top: 0 !important; background-color: white !important; }
        .modal-footer, .navbar, .btn-close, .alert, .no-print { display: none !important; }
        .modal-content { border: none !important; box-shadow: none !important; }
        .container { width: 100% !important; max-width: 100% !important; margin: 0 !important; padding: 0 !important; }
        .print-only { display: block !important; }
        .table-secondary { background-color: #e2e3e5 !important; -webkit-print-color-adjust: exact; }
    }
    .signature-img {
      max-width: 150px;
      max-height: 80px;
      display: block;
      margin: 10px auto;
    }
    #zoneAvancesDisponibles {
      background-color: #e7f3ff;
      border: 1px solid #b3d7ff;
      border-radius: 8px;
    }
    .clickable-row { cursor: pointer; transition: background 0.2s; }
    .clickable-row:hover { background-color: #e9ecef !important; }
  </style>
</head>
<body>

  <nav class="navbar fixed-top navbar-expand-lg">
    <div class="container-fluid">
      <a class="navbar-brand" href="#">SmartLocation <span id="navbarDate" class="ms-3 navbar-date"></span></a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon bg-light"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="index.html">Tableau de bord</a></li>
          <li class="nav-item"><a class="nav-link" href="config.html">Configuration</a></li>
          <li class="nav-item"><a class="nav-link active" href="gestion.html">Saisie des paiements</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="container">
    <h2 class="text-center mb-4">💳 Gestion des Paiements</h2>

    <div class="mb-4">
      <label class="form-label">🏢 Sélectionner un appartement</label>
      <select id="selectAppartement" class="form-select">
          <option value="">-- Charger les appartements... --</option>
      </select>
    </div>

    <div id="listeAppartements" class="mb-4"></div>

    <div class="row mb-4">
        <div class="col-md-4 mb-3">
            <label for="nomProprietaireAffichage" class="form-label">👤 Nom du Propriétaire</label>
            <input type="text" id="nomProprietaireAffichage" class="form-control info-recuperee" readonly />
        </div>
        <div class="col-md-4 mb-3">
            <label for="contactProprietaireAffichage" class="form-label">📞 Contact Propriétaire</label>
            <input type="text" id="contactProprietaireAffichage" class="form-control info-recuperee" readonly />
        </div>
        <div class="col-md-4 mb-3">
            <label for="coutMensuelAffichage" class="form-label">💰 Coût Mensuel (FCFA)</label>
            <div class="input-group">
                <input type="number" id="coutMensuel" class="form-control info-recuperee" readonly />
            </div>
        </div>
    </div>

    <form id="formAppartement" class="d-none">
        <input type="text" id="nomAppartement">
        <input type="text" id="locataire">
        <input type="date" id="dateEntree">
    </form>

    <div class="row">
        <div class="col-md-4 mb-3">
            <label class="form-label">📅 Mois à payer</label>
            <select id="mois" class="form-select" multiple size="8"></select>
        </div>
        <div class="col-md-4 mb-3">
            <label class="form-label">💰 Déjà Payé (Cumulé FCFA)</label>
            <input type="text" id="montantCumulePaye" class="form-control" value="0" readonly />
            
            <label class="form-label mt-3">🚨 Total des Retards (FCFA)</label>
            <input type="text" id="montantRetards" class="form-control" value="0" readonly />
        </div>
        <div class="col-md-4 mb-3">
            <label class="form-label">💵 Montant Sélectionné (FCFA)</label>
            <input type="number" id="montant" class="form-control" readonly style="color: #006400; font-weight: bold;" />
            
            <label class="form-label mt-3">📝 Observation</label>
            <input type="text" id="observation" class="form-control" placeholder="Note ou référence" />
        </div>
    </div>

    <div id="zoneAvancesDisponibles" class="p-3 mb-3 d-none text-center border shadow-sm">
        <h6 class="text-primary fw-bold mb-2">🎁 Avances disponibles détectées !</h6>
        <p id="infoMoisAvance" class="small mb-2"></p>
        <button class="btn btn-primary btn-sm">Utiliser les avances pour payer</button>
    </div>

    <div class="d-grid gap-2 mb-3">
      <button class="btn btn-success" id="btnValiderPaiement">Ajouter Paiement</button>
      <div class="row g-2">
          <div class="col-12"><button class="btn btn-outline-primary w-100">Ajouter Avance</button></div>
      </div>
      <button class="btn btn-primary">📊 Rapport Général de Location</button>
      <button id="toggleHistoriqueBtn" class="btn btn-outline-secondary">Afficher l'historique</button>
    </div>

    <div id="historiqueSection" class="mt-4">
      <h4 class="text-primary mb-2">📋 Historique des paiements</h4>
      <div class="table-responsive"> 
        <table class="table table-bordered table-striped">
          <thead>
            <tr><th>Mois</th><th>Montant</th><th>Type</th><th>Observation</th><th>Actions</th></tr>
          </thead>
          <tbody id="historiquePaiements"></tbody>
        </table>
      </div>
    </div>

    <footer>
      Conçu par <strong>Plateny AMOUSSOU</strong> – Professeur & Innovateur local<br />
      📧 atizoun@gmail.com | 📞 01 97 74 40 35
    </footer>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc, query, where } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCPxkdwz-wNR3wNnDSMyFMAwKKVKvNlacs",
      authDomain: "smartloc-famille-804c4.firebaseapp.com",
      projectId: "smartloc-famille-804c4",
      storageBucket: "smartloc-famille-804c4.firebasestorage.app",
      messagingSenderId: "1079256920416",
      appId: "1:1079256920416:web:94a3a9dc26044efaeeae05"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const selectApt = document.getElementById('selectAppartement');
    const inputCout = document.getElementById('coutMensuel');
    const inputProprio = document.getElementById('nomProprietaireAffichage');
    const inputContact = document.getElementById('contactProprietaireAffichage');
    const selectMois = document.getElementById('mois');
    const inputMontant = document.getElementById('montant');
    
    let listeAppartementsData = [];
    let paiementsLocaux = []; // Pour stocker temporairement les paiements de l'appartement sélectionné
    const moisAnnee = ["Janvier", "Février", "Mars", "Avril", "Mai", "Juin", "Juillet", "Août", "Septembre", "Octobre", "Novembre", "Décembre"];

    // Génération dynamique de la liste des mois avec code couleur
    function genererMois() {
        selectMois.innerHTML = "";
        const annee = new Date().getFullYear();
        moisAnnee.forEach(m => {
            const nomComplet = `${m} ${annee}`;
            const opt = document.createElement('option');
            opt.value = nomComplet;
            opt.textContent = nomComplet;

            // Vérifier si le mois est déjà payé dans l'historique chargé
            const dejaPaye = paiementsLocaux.some(p => p.mois.includes(nomComplet));
            if(dejaPaye) {
                opt.classList.add('option-paye');
                opt.textContent += " ✅";
            } else {
                opt.classList.add('option-retard');
            }
            selectMois.appendChild(opt);
        });
    }

    async function chargerAppartements() {
      try {
        const querySnapshot = await getDocs(collection(db, "appartements"));
        selectApt.innerHTML = '<option value="">-- Choisir un appartement --</option>';
        listeAppartementsData = [];
        querySnapshot.forEach((docSnap) => {
          const data = docSnap.data();
          const apt = { id: docSnap.id, ...data };
          listeAppartementsData.push(apt);
          const opt = document.createElement('option');
          opt.value = apt.id;
          opt.textContent = apt.nom; 
          selectApt.appendChild(opt);
        });
      } catch (error) { console.error(error); }
    }

    selectMois.addEventListener('change', () => {
        const nbMois = Array.from(selectMois.selectedOptions).length;
        const cout = parseFloat(inputCout.value) || 0;
        inputMontant.value = nbMois * cout;
    });

    selectApt.addEventListener('change', async () => {
      const apt = listeAppartementsData.find(a => a.id === selectApt.value);
      if (apt) {
        inputCout.value = apt.cout || 0;
        inputProprio.value = apt.proprietaireNom || "Non défini";
        inputContact.value = apt.proprietaireContact || "Non défini";
        inputMontant.value = 0;
        // On charge l'historique avant de générer la liste des mois pour le code couleur
        await chargerHistorique(apt.id, apt); 
      }
    });

    document.getElementById('btnValiderPaiement').addEventListener('click', async () => {
        const aptId = selectApt.value;
        const apt = listeAppartementsData.find(a => a.id === aptId);
        const moisSelectionnes = Array.from(selectMois.selectedOptions).map(o => o.value);
        const montantTotal = parseFloat(inputMontant.value);
        const observation = document.getElementById('observation').value;

        if (!aptId || moisSelectionnes.length === 0) {
            alert("Veuillez choisir un appartement et au moins un mois.");
            return;
        }

        try {
            await addDoc(collection(db, "paiements"), {
                idAppartement: aptId,
                mois: moisSelectionnes.join(", "),
                montant: montantTotal,
                type: "Loyer",
                observation: observation,
                dateAction: new Date().toISOString()
            });
            alert("Paiement enregistré !");
            document.getElementById('observation').value = "";
            inputMontant.value = 0;
            await chargerHistorique(aptId, apt);
        } catch (e) { console.error(e); }
    });

    async function chargerHistorique(aptId, apt) {
        const q = query(collection(db, "paiements"), where("idAppartement", "==", aptId));
        const querySnapshot = await getDocs(q);
        const tbody = document.getElementById('historiquePaiements');
        let totalPaye = 0;
        tbody.innerHTML = "";
        paiementsLocaux = [];

        querySnapshot.forEach((docSnap) => {
            const p = docSnap.data();
            paiementsLocaux.push(p);
            totalPaye += p.montant;
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${p.mois}</td>
                <td>${p.montant} F</td>
                <td>${p.type}</td>
                <td>${p.observation || "-"}</td>
                <td><button class="btn btn-danger btn-sm" onclick="supprimerPaiement('${docSnap.id}', '${aptId}')">X</button></td>
            `;
            tbody.appendChild(tr);
        });

        // Mise à jour de la liste des mois avec les nouvelles couleurs
        genererMois();

        // Mise à jour dynamique des compteurs
        document.getElementById('montantCumulePaye').value = totalPaye + " FCFA";
        
        // Calcul du retard théorique
        if(apt && apt.dateEntree && apt.cout) {
            const dateDebut = new Date(apt.dateEntree);
            const dateFin = new Date();
            const moisEcoules = (dateFin.getFullYear() - dateDebut.getFullYear()) * 12 + (dateFin.getMonth() - dateDebut.getMonth()) + 1;
            const totalDu = moisEcoules * apt.cout;
            const retard = Math.max(0, totalDu - totalPaye);
            document.getElementById('montantRetards').value = retard + " FCFA";
        }
    }

    window.supprimerPaiement = async (id, aptId) => {
        if(confirm("Supprimer ce paiement ?")) {
            await deleteDoc(doc(db, "paiements", id));
            const apt = listeAppartementsData.find(a => a.id === aptId);
            chargerHistorique(aptId, apt);
        }
    };

    document.getElementById('toggleHistoriqueBtn').addEventListener('click', () => {
        const section = document.getElementById('historiqueSection');
        section.style.display = (section.style.display === "none" || section.style.display === "") ? "block" : "none";
        document.getElementById('toggleHistoriqueBtn').textContent = section.style.display === "block" ? "Masquer l'historique" : "Afficher l'historique";
    });

    function mettreAJourNavbarDate() {
        const d = new Date();
        document.getElementById('navbarDate').textContent = d.toLocaleDateString('fr-FR', { day: 'numeric', month: 'long', year: 'numeric' });
    }

    mettreAJourNavbarDate();
    genererMois();
    chargerAppartements();
  </script>
</body>
</html>
