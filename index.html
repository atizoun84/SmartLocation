<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SmartLocation – Tableau de Bord</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#003366">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body { background-color: #f0f2f5; font-family: 'Segoe UI', sans-serif; padding-top: 70px; }
    .navbar { background-color: #003366; }
    .navbar-brand, .nav-link { color: white !important; }
    .stat-card { border: none; border-radius: 15px; transition: transform 0.3s; color: white; cursor: pointer; }
    .stat-card:hover { transform: translateY(-5px); box-shadow: 0 10px 20px rgba(0,0,0,0.1); }
    .bg-income { background: linear-gradient(45deg, #00b09b, #96c93d); }
    .bg-pending { background: linear-gradient(45deg, #f85032, #e73827); }
    .bg-apartments { background: linear-gradient(45deg, #003366, #00509e); }
    .bg-rate { background: linear-gradient(45deg, #fbc2eb, #a6c1ee); }
    .card-title-custom { font-size: 0.9rem; text-transform: uppercase; opacity: 0.9; }
    .card-value { font-size: 1.8rem; font-weight: bold; }
    footer { margin-top: 40px; font-size: 0.9em; text-align: center; color: #666; padding-bottom: 20px; }
    .alert-scroll { max-height: 350px; overflow-y: auto; }
    .modal-header-pro { background-color: #003366; color: white; border-bottom: 3px solid #ffcc00; }
    .detail-item { border-bottom: 1px solid #eee; padding: 10px 0; }
    .bien-detail { font-size: 0.85rem; border-left: 3px solid #003366; margin-bottom: 10px; padding-left: 10px; }
  </style>
</head>
<body>

  <nav class="navbar fixed-top navbar-expand-lg">
    <div class="container-fluid">
      <a class="navbar-brand" href="#">SmartLocation</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon bg-light"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link active" href="index.html">Tableau de bord</a></li>
          <li class="nav-item"><a class="nav-link" href="config.html">Configuration</a></li>
          <li class="nav-item"><a class="nav-link" href="gestion.html">Gestion</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="container">
    <h2 class="mb-4">📊 Tableau de Bord Immobilier</h2>

    <div class="row g-3 mb-4">
      <div class="col-md-3">
        <div class="card stat-card bg-apartments p-3" onclick="afficherDetailsPro('Appartements')">
          <div class="card-title-custom">Appartements</div>
          <div class="card-value" id="totalApparts">...</div>
        </div>
      </div>
      <div class="col-md-3">
        <div class="card stat-card bg-income p-3" onclick="afficherDetailsPro('Revenus')">
          <div class="card-title-custom">Revenus Totaux</div>
          <div class="card-value" id="totalRevenus">0 F</div>
        </div>
      </div>
      <div class="col-md-3">
        <div class="card stat-card bg-pending p-3" onclick="afficherDetailsPro('Impayés')">
          <div class="card-title-custom">Impayés Estimés</div>
          <div class="card-value" id="totalImpayes">0 F</div>
        </div>
      </div>
      <div class="col-md-3">
        <div class="card stat-card bg-rate p-3" style="color: #333;" onclick="afficherDetailsPro('Taux')">
          <div class="card-title-custom">Taux de Recouvrement</div>
          <div class="card-value" id="tauxRecouvrement">0%</div>
        </div>
      </div>
    </div>

    <div class="row">
      <div class="col-md-7 mb-4">
        <div class="card shadow-sm h-100">
          <div class="card-body">
            <h5 class="card-title">Répartition Financière</h5>
            <canvas id="chartFinances"></canvas>
          </div>
        </div>
      </div>
      <div class="col-md-5 mb-4">
        <div class="card shadow-sm h-100">
          <div class="card-header bg-white fw-bold text-danger">⚠️ Alertes : Retards</div>
          <div class="card-body alert-scroll">
            <ul class="list-group list-group-flush" id="listeAlertes"></ul>
          </div>
        </div>
      </div>
    </div>

    <div class="modal fade" id="modalDetailsPro" tabindex="-1">
      <div class="modal-dialog modal-dialog-centered modal-lg">
        <div class="modal-content border-0 shadow-lg">
          <div class="modal-header modal-header-pro">
            <h5 class="modal-title fw-bold" id="modalTitre">📜 RÉSUMÉ EXÉCUTIF</h5>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body" id="modalCorps"></div>
          <div class="modal-footer bg-light">
            <button class="btn btn-success" onclick="copierResumeWhatsApp()">Copier pour WhatsApp</button>
            <button class="btn btn-secondary" data-bs-dismiss="modal">Fermer</button>
          </div>
        </div>
      </div>
    </div>

    <footer>Conçu par Atizoun Plateny AMOUSSOU</footer>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCPxkdwz-wNR3wNnDSMyFMAwKKVKvNlacs",
      authDomain: "smartloc-famille-804c4.firebaseapp.com",
      projectId: "smartloc-famille-804c4",
      storageBucket: "smartloc-famille-804c4.firebasestorage.app",
      messagingSenderId: "1079256920416",
      appId: "1:1079256920416:web:94a3a9dc26044efaeeae05"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let globalApts = [];
    let globalPaiements = {};
    const modalPro = new bootstrap.Modal(document.getElementById('modalDetailsPro'));
    let resumeTexteGlobal = "";

    async function initialiserTableauBord() {
        // 1. Récupérer Appartements
        const snapApts = await getDocs(collection(db, "appartements"));
        globalApts = snapApts.docs.map(doc => ({ id: doc.id, ...doc.data() }));

        // 2. Récupérer Paiements
        const snapPaies = await getDocs(collection(db, "paiements"));
        snapPaies.forEach(doc => {
            const p = doc.data();
            if(!globalPaiements[p.idAppartement]) globalPaiements[p.idAppartement] = [];
            globalPaiements[p.idAppartement].push(p);
        });

        calculerEtAfficher();
    }

    function calculerEtAfficher() {
        const maintenant = new Date();
        const moisActuelStr = maintenant.toISOString().slice(0, 7);
        let revenusTotaux = 0, impayesTotaux = 0;
        let labels = [], dataPaye = [], dataRetard = [];
        const listeAlertes = document.getElementById('listeAlertes');
        listeAlertes.innerHTML = "";

        globalApts.forEach(apt => {
            labels.push(apt.nom);
            const paies = globalPaiements[apt.id] || [];
            const totalPayeApt = paies.reduce((sum, p) => sum + parseFloat(p.montant), 0);
            revenusTotaux += totalPayeApt;
            dataPaye.push(totalPayeApt);

            // Calcul retards simplifié
            let retardApt = 0;
            if(apt.dateEntree) {
                let current = new Date(apt.dateEntree);
                while(current.toISOString().slice(0, 7) < moisActuelStr) {
                    const m = current.toISOString().slice(0, 7);
                    if(!paies.some(p => p.mois === m)) retardApt += parseFloat(apt.cout);
                    current.setMonth(current.getMonth() + 1);
                }
            }
            impayesTotaux += retardApt;
            dataRetard.push(retardApt);

            if(retardApt > 0) {
                listeAlertes.innerHTML += `<li class="list-group-item d-flex justify-content-between align-items-center">
                    <div><strong>${apt.nom}</strong><br><small>${apt.locataire}</small></div>
                    <span class="badge bg-danger">${retardApt.toLocaleString()} F</span>
                </li>`;
            }
        });

        document.getElementById('totalApparts').textContent = globalApts.length;
        document.getElementById('totalRevenus').textContent = `${revenusTotaux.toLocaleString()} F`;
        document.getElementById('totalImpayes').textContent = `${impayesTotaux.toLocaleString()} F`;
        const taux = (revenusTotaux + impayesTotaux) > 0 ? Math.round((revenusTotaux/(revenusTotaux+impayesTotaux))*100) : 0;
        document.getElementById('tauxRecouvrement').textContent = `${taux}%`;

        genererGraphique(labels, dataPaye, dataRetard);
    }

    function genererGraphique(labels, paye, retard) {
        const ctx = document.getElementById('chartFinances').getContext('2d');
        new Chart(ctx, {
            type: 'bar',
            data: {
                labels: labels,
                datasets: [
                    { label: 'Payé', data: paye, backgroundColor: '#00b09b' },
                    { label: 'Retard', data: retard, backgroundColor: '#f85032' }
                ]
            },
            options: { responsive: true, plugins: { legend: { position: 'bottom' } } }
        });
    }

    window.afficherDetailsPro = (type) => {
        let corps = `<div class="text-center mb-3"><h6>État au ${new Date().toLocaleDateString()}</h6><hr></div>`;
        globalApts.forEach(apt => {
            corps += `<div class="bien-detail"><strong>${apt.nom}</strong> (${apt.locataire})</div>`;
        });
        document.getElementById('modalCorps').innerHTML = corps;
        modalPro.show();
    };

    window.onload = initialiserTableauBord;
  </script>
</body>
</html>
